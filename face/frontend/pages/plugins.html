<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZUZZ — Plugins</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#9679;</span>
      <div>
        <h1>ZUZZ</h1>
        <span class="tagline">Plugins</span>
      </div>
    </div>
    <div class="status-cluster">
      <a class="ghost-btn tab-link" href="/" title="Chat">Chat</a>
      <a class="ghost-btn tab-link" href="/pages/dashboard.html" title="Dashboard">Dashboard</a>
    </div>
  </header>

  <main class="dash-grid">
    <section class="panel span-2" aria-label="Installed plugins">
      <div class="panel-head">
        <span class="panel-title">Installed Plugins</span>
        <button id="scan-plugins" class="ghost-btn" type="button">Scan</button>
      </div>
      <div id="plugin-list" class="plugin-grid"></div>
    </section>

    <section class="panel span-2" aria-label="Marketplace">
      <div class="panel-head"><span class="panel-title">Marketplace</span></div>
      <p class="prose">Browse and create plugins. Coming soon.</p>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/plugins.js"></script>
</body>
</html>
