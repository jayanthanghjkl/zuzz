name: Core regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Python tests (physical audio tests explicitly skipped)
        run: python -m pytest -q
      - name: Browser wiring contract tests (not physical browser/audio certification)
        run: node --test tests/frontend/*.test.cjs
